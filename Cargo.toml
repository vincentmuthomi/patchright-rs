[workspace]
members = [
    "crates/patchright",
    "crates/playwright-rs-macros",
    "crates/playwright-rs-trace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["patchright-rs contributors", "Paul Adamson (playwright-rust)"]
repository = "https://github.com/padamson/playwright-rust"  # TODO: set to the patchright-rs repository

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
